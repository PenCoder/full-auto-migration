services:
  # Build the AppImage using the Dockerfile builder stage.
  # Usage:  docker compose run --rm builder
  # Output: ./dist/MigrationWizard-x86_64.AppImage
  builder:
    build:
      context: .
      target: builder
    volumes:
      - ./dist:/build/dist
    command: echo "AppImage already built during docker build — check dist/"

  # Run the app inside a container with X11 forwarding (for testing).
  # Usage:  DISPLAY=:0 docker compose up runtime
  runtime:
    build:
      context: .
      target: runtime
    environment:
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/data
