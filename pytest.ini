[pytest]
# Pytest configuration file for Semi-AutoMigration project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 3.9

# Add command line options
addopts = 
    # Show extra test summary info
    -ra
    # Strict markers
    --strict-markers
    # Show local variables in tracebacks
    -l
    # Report on short test summary
    --tb=short
    # Show slowest 10 tests
    --durations=10
    # Enable warnings
    --strict-config

# Test paths
testpaths = tests

# Python paths
pythonpath = .

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    e2e: End-to-end workflow tests
    ui: UI component tests
    performance: Performance and scalability tests
    slow: Tests that take longer to run
    fast: Tests that run quickly
    requires_qt: Tests that require Qt/PyQt5
    mock_heavy: Tests that use many mocks
    requires_disk: Tests that require disk I/O
    requires_network: Tests that require network access
    parameterized: Tests with multiple parameter sets

# Coverage options
[coverage:run]
branch = True
source = src
omit =
    */tests/*
    */test_*.py
    **/__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    @overload

[coverage:html]
directory = htmlcov
