project:
  name: "Semi-Automated Migration from Windows 11 to Linux Mint"
  version: "0.1.0"
  maintainer: "Kofi"

source_system:
  windows_user: null  # If null, auto-detects current user
  inventory_output_dir: "inventory"
  backup_output_dir: "backup"

  backup_paths:
    - "~/Documents"
    - "~/Desktop"
    # - "Pictures"
    # - "Downloads"

  excluded_paths:
    - "AppData/Local/Temp"
    - "AppData/Local/Cache"
  
  file_types:
