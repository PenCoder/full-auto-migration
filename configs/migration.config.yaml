    ".html": "HTML files"
    ".css": "CSS files"
    ".sql": "SQL files"

backup:
  compress: true
  archive_name: "backup.zip"

target_system:
  distro: "linux-mint"            # linux-mint or ubuntu
  edition: "cinnamon"             # cinnamon, mate, xfce
  language: "en_US.UTF-8"
  timezone: "Europe/Berlin"
  hostname: "mint-migrated-system"
  username: "linuxuser"
  auto_login: false

migration:
  mode: "full_clean"              # full_clean or dual_boot (future)
  target_disk: "/dev/sda"
  layout: "full_disk"             # full_disk or custom
  swap_size_gb: 4
  encrypt_root: false
  backup_location: "/mnt/backup"
  include_hidden_files: false

  software_profile: "standard"    # standard / developer / custom
  extra_packages:
    - "vlc"
    - "gimp"

automation:
  dry_run: false
  auto_start_full_flow: false
  auto_start_delay_ms: 250
  enable_dynamic_rules: true
  active_profile_path: "data/profiles/active_profile.json"
  checkpoint_dir: "data/checkpoints"
  logging_level: "INFO"           # DEBUG / INFO / WARNING / ERROR
  log_file: "logs/migration.log"
  confirm_destructive_actions: true

validation:
  check_network: true
  check_audio: true
  check_gpu: true
  check_video_playback: true
  check_office_suite: true

research:
  record_metrics: true
  anonymize_machine_id: true
  save_run_summary: "logs/run_summary.json"

ai:
  enabled: false
  endpoint: ""
  model: ""
  api_key: ""
  temperature: 0.2
  timeout_seconds: 10
  file_recommendation_online_enabled: false
  software_online_lookup_enabled: true
  software_online_provider: "repology"
  software_online_send_fields:
    - "name"
    - "version"
    - "publisher"
  redact_user_paths: true


# ---------------------------------------

demo:
  mode: true
  include_dirs:
    - "~/Documents"
    - "~/Desktop"
  file_extensions:
    - ".txt"
    - ".pdf"
    - ".docx"
    - ".jpg"
    - ".png"
  max_files: 30