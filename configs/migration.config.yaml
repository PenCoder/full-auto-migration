    ".csv": true
    ".ppt": true
    ".pptx": true
    ".odp": true
    ".jpg": true
    ".jpeg": true
    ".png": true
    ".gif": false
    ".bmp": false
    ".webp": false
    ".svg": false
    ".mp3": true
    ".wav": false
    ".flac": false
    ".aac": false
    ".mp4": true
    ".mkv": false
    ".mov": false
    ".avi": false
    ".zip": true
    ".rar": false
    ".7z": true
    ".tar": false
    ".gz": false
    ".json": true
    ".xml": true
    ".yaml": true
    ".yml": true
    ".ini": true
    ".log": false
    ".py": true
    ".js": true
    ".ts": true
    ".html": true
    ".css": true
