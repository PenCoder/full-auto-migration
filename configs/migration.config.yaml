    ".txt": "Text files"
    ".md": "Markdown files"
    ".rtf": "Rich text files"
    ".pdf": "PDF files"
    ".doc": "Word document files"
    ".docx": "Word document files"
    ".odt": "OpenDocument text files"
    ".xls": "Excel spreadsheet files"
    ".xlsx": "Excel spreadsheet files"
    ".csv": "CSV files"
    ".ppt": "PowerPoint presentation files"
    ".pptx": "PowerPoint presentation files"
    ".odp": "OpenDocument presentation files"
    ".jpg": "JPEG image files"
    ".jpeg": "JPEG image files"
    ".png": "PNG image files"
    ".gif": "GIF image files"
    ".bmp": "Bitmap image files"
    ".webp": "WebP image files"
    ".svg": "SVG image files"
    ".mp3": "MP3 audio files"
    ".wav": "WAV audio files"
    ".flac": "FLAC audio files"
    ".aac": "AAC audio files"
    ".mp4": "MP4 video files"
    ".mkv": "Matroska video files"
    ".mov": "MOV video files"
    ".avi": "AVI video files"
